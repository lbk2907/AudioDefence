# -Xms64m is what Gradle's own start script gives its Java: asked for here too, with GRADLE_OPTS set to this
# line (compiler.gradle_env), the build runs in that Java instead of forking a single-use one for itself
org.gradle.jvmargs=-Xmx3g -Xms64m -Dfile.encoding=UTF-8
# Gradle stops when the build ends, rather than staying in memory for hours to start the next one sooner:
# a Gradle left running holds about a gigabyte and locks its own folder, so it cannot be moved or updated
org.gradle.daemon=false
