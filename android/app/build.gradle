plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// The app's version is the repository's VERSION, the release tag (26.10.01-1: year, month, day, build), read
// as the build is set up.  versionName is the tag itself.  versionCode is the same digits as one number,
// yymmddNN - 26100101 - which grows with every release, so Android takes each one as newer than the last and
// installs it over it, and stays far below Android's ceiling of 2100000000 (99123199 at the most).  A
// checkout with no VERSION is today's first release, as the game run from source makes it
// (platform/version.py).
def releaseTag = { ->
    def f = rootProject.file('../VERSION')
    def line = f.exists() ? f.readLines().find { it.trim() } : null
    return line ? line.trim() : new java.text.SimpleDateFormat('yy.MM.dd').format(new Date()) + '-1'
}()
def releaseCode = { String tag ->
    def parts = (tag =~ /\d+/).collect { it as int }
    if (parts.size() < 3) {
        throw new GradleException("VERSION should be like 26.10.01-1, not '${tag}'")
    }
    def build = parts.size() > 3 ? parts[3] : 0
    if (parts[0] > 99 || parts[1] > 12 || parts[2] > 31 || build > 99) {
        throw new GradleException("VERSION ${tag} does not fit a version code (yymmddNN)")
    }
    return ((parts[0] * 100 + parts[1]) * 100 + parts[2]) * 100 + build
}(releaseTag)

// The Python the app runs (Chaquopy's `version`), and that same version's python.exe on this computer, which
// Chaquopy needs to build the app's Python with.  Chaquopy's own search did not find it from inside Gradle
// ("Couldn't find Python 3.13") though `py -3.13` ran it from a command prompt, so the exact python.exe is
// given when it is known: a -PbuildPython=... (or AUDIODEFENCE_BUILD_PYTHON) if one is passed, or else
// where Python's installers put it - the Python install manager (pythoncore-3.13-64) or python.org's
// installer, for one user or for everyone.  Found nowhere, Chaquopy is left to search as it does.
def appPython = '3.13'
def buildPythonExe = { ->
    def given = findProperty('buildPython') ?: System.getenv('AUDIODEFENCE_BUILD_PYTHON')
    if (given) {
        return given
    }
    def nodot = appPython.replace('.', '')
    def local = System.getenv('LOCALAPPDATA')
    def places = []
    if (local) {
        places << "${local}/Python/pythoncore-${appPython}-64/python.exe"
        places << "${local}/Programs/Python/Python${nodot}/python.exe"
    }
    places << "C:/Program Files/Python${nodot}/python.exe"
    return places.find { new File(it).isFile() }
}()

android {
    namespace 'com.audiodefence'
    compileSdk 35

    defaultConfig {
        applicationId "com.audiodefence.android"
        minSdk 26
        targetSdk 34
        versionCode releaseCode
        versionName releaseTag

        // Python 3.13 on Android has no 32-bit build; every phone of the last several years is arm64
        ndk {
            abiFilters "arm64-v8a"
        }
        python {
            version appPython
            if (buildPythonExe) {
                buildPython buildPythonExe
            }
            pip {
                install "numpy"
            }
        }
    }

    // the game's sounds are read by file path after unpacking; keeping them uncompressed makes the APK unpack faster
    androidResources {
        noCompress "m4a", "mp3", "mhr", "plist", "json"
        // Android leaves out of the APK, without a word, every folder whose name starts with an underscore
        // (and a few others). The game's data has such folders - game/sounds/_weapons among them - so this
        // is Android's usual list minus those two rules: everything in game/ goes in, apart from junk like .git.
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    // The release is signed with the project's own permanent key: AD_KEYSTORE names the key file (a .p12)
    // when a release is built.  Every release has to be signed with this same key, or Android refuses to
    // install it over the one a player already has.  The key file itself is the secret; the passwords below
    // only open it.  They and the alias are the ones tools/android_keys.py makes every key with; a key made
    // some other way gives its own in AD_KEY_ALIAS, AD_KEYSTORE_PASSWORD and AD_KEY_PASSWORD.
    signingConfigs {
        release {
            def keystore = System.getenv('AD_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storeType 'pkcs12'
                storePassword System.getenv('AD_KEYSTORE_PASSWORD') ?: 'audiodefence-android'
                keyAlias System.getenv('AD_KEY_ALIAS') ?: 'audiodefence'
                keyPassword System.getenv('AD_KEY_PASSWORD') ?: 'audiodefence-android'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('AD_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// The app is built from this repository's own game: the Python package (../audiodefence), the game's data
// (../game), its HRTF (../assets/hrtf), the language files (../localization) and the VERSION file, plus the
// Android-only stand-in for pygame (android/python).  Before every build they are copied to where Chaquopy and
// the APK take them from - src/main/python and src/main/assets, which hold nothing else and are git-ignored
// (android/.gitignore) - so there is one copy of the game, the one the Windows and Mac builds are made from.
def repo = rootProject.file('..')

tasks.register('copyGamePython', Sync) {
    from(new File(repo, 'audiodefence')) {
        into 'audiodefence'
        exclude '**/__pycache__/**', '**/*.pyc'
        // the desktop's launcher, and what only the desktop's speech and haptics use: the phone has stand-ins
        // (audiodefence/platform/__init__.py) and never imports these
        exclude '__main__.py', 'platform/haptic_audio.py', 'platform/macspeech.py', 'platform/remotezip.py',
                'platform/speech_audio.py', 'platform/speech_stream.py'
    }
    from(rootProject.file('python')) {
        exclude '**/__pycache__/**', '**/*.pyc'
    }
    into 'src/main/python'
}

tasks.register('copyGameAssets', Sync) {
    from(new File(repo, 'game')) { into 'game' }
    from(new File(repo, 'assets/hrtf')) { into 'hrtf' }
    from(new File(repo, 'localization')) {
        into 'localization'
        include '*.json'
        exclude 'template.json'
    }
    from(new File(repo, 'VERSION'))
    into 'src/main/assets'
}

// Everything else in the build comes after the copies: whatever reads the Python or the assets (Chaquopy's
// tasks, the asset merge, lint) then sees them, and Gradle has no task reading a folder another one writes.
tasks.configureEach { t ->
    if (!(t.name in ['copyGamePython', 'copyGameAssets', 'clean'])) {
        t.dependsOn 'copyGamePython', 'copyGameAssets'
    }
}

// After a build, say in the build log whether every file of the game's data made it into the APK.
// It only reports; it never stops a build.
afterEvaluate {
    tasks.matching { it.name == 'assembleDebug' || it.name == 'assembleRelease' }.configureEach { t ->
        t.doLast {
            try {
                def src = file('src/main/assets/game')
                if (!src.isDirectory()) {
                    println 'GAME DATA CHECK: there is no game folder in the project'
                    return
                }
                def wanted = [] as Set
                fileTree(src).visit { d -> if (!d.isDirectory()) wanted << ('assets/game/' + d.relativePath.pathString) }
                def variant = t.name == 'assembleDebug' ? 'debug' : 'release'
                fileTree("build/outputs/apk/${variant}").matching { include '*.apk' }.each { apk ->
                    def packed = [] as Set
                    def z = new java.util.zip.ZipFile(apk)
                    try {
                        z.entries().each { e -> if (!e.isDirectory()) packed << e.name }
                    } finally {
                        z.close()
                    }
                    def missing = wanted.findAll { !packed.contains(it) }.sort()
                    println "GAME DATA CHECK: ${wanted.size()} game files, ${missing.size()} missing from ${apk.name}"
                    missing.take(100).each { println "  missing: ${it}" }
                }
            } catch (Throwable e) {
                println "GAME DATA CHECK could not run: ${e}"
            }
        }
    }
}
